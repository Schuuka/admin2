version: "3.9"

secrets:
  db_app_password:
    external: true

services:
  db:
    image: ttranthi/woody_database:latest
    environment:
      - MYSQL_DATABASE=woody
      - MYSQL_ROOT_PASSWORD=pass
    volumes:
      - db-data:/var/lib/mysql
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.db == true
      restart_policy:
        condition: on-failure
    networks: [data]

  redis:
    image: redis:alpine
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.db == true
      restart_policy:
        condition: on-failure
    networks: [data]

  api:
    image: ttranthi/woody_api:secure
    environment:
      DB_HOST: db
      DB_USER: woody-app
      DB_PASS_FILE: /run/secrets/db_app_password
      DB_NAME: woody
      REDIS_HOST: redis
      ALLOWED_ORIGINS: https://www.l1-6.ephec-ti.be
    secrets:
      - db_app_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 5
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    networks: [web, data]

  front:
    image: ttranthi/woody_front:cdn
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    networks: [web]

  reverse:
    image: ttranthi/woody_rp:latest
    ports:
      - "8080:8080"
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    networks: [web]

networks:
  web:
    driver: overlay
    driver_opts:
      encrypted: "true"
  data:
    driver: overlay
    driver_opts:
      encrypted: "true"

volumes:
  db-data:
