
events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format log_per_virtualhost '[$host] $remote_addr [$time_local] $status "$request" $body_bytes_sent';
  access_log /dev/stdout log_per_virtualhost;
  error_log  /dev/stderr;

  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 80;
    server_name www.l1-6.tonyephec.cloud ;
    root /var/www/html/www;
    index index.php index.html;

    location / { try_files $uri $uri/ /index.php?$args; }

    location ~ .php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_pass php:9000;
    }
  }

  server {
    listen 80;
    server_name blog.l1-6.tonyephec.cloud;
    root /var/www/html/blog;
    index index.html;
  }
}
