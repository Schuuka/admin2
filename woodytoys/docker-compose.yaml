services:
  web:
    image: nginx:latest
    container_name: web
    ports:
      - "80:80"
    volumes:
      - ./html:/var/www/html
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      php:
        condition: service_started
      db:
        condition: service_started
    restart: unless-stopped
    networks: [woodytoys-network]

  php:
    container_name: php
    build:
      context: ./php
      dockerfile: Dockerfile
    volumes:
      - ./html:/var/www/html
    restart: unless-stopped
    networks: [woodytoys-network]

  db:
    container_name: db
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: mypass
      MYSQL_DATABASE: woodytoys
    volumes:
      - db-data:/var/lib/mysql
      - ./woodytoys.sql:/docker-entrypoint-initdb.d/woodytoys.sql:ro
    restart: unless-stopped
    networks: [woodytoys-network]

networks:
  woodytoys-network:
    driver: bridge

volumes:
  db-data:

