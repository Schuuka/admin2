events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format log_per_virtualhost '[$host] $remote_addr [$time_local] $status "$request" $body_bytes_sent';
  access_log /dev/stdout log_per_virtualhost;
  error_log  /dev/stderr;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';

  server {
    listen 80;
    server_name www.l1-6.tonyephec.cloud;
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/html;    
    }  
    return 301 https://www.l1-6.tonyephec.cloud$request_uri;
  }

  server {
    listen 443 ssl;
    server_name www.l1-6.tonyephec.cloud ;
    root /var/www/html/www;
    index index.php index.html;

    ssl_certificate     /etc/letsencrypt/live/l1-6.tonyephec.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/l1-6.tonyephec.cloud/privkey.pem;

    location / { try_files $uri $uri/ /index.php?$args; }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_pass php:9000;
    }
  }

  server {
    listen 80;
    server_name blog.l1-6.tonyephec.cloud;
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/html;    
    }
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name blog.l1-6.tonyephec.cloud;
    root  /var/www/html/blog;
    index index.html;
  }
}
