events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log /dev/stdout;
  error_log  /dev/stderr;

  server_tokens off;          # ne pas divulguer la version de nginx

  # ---- Passerelle API : un upstream par microservice ----
  upstream misc_up   { server misc-service:8080; }
  upstream prod_up   { server product-service:8081; }
  upstream order_up  { server order-service:8082; }
  upstream front_up  { server front:80; }

  # ---- Limitation de debit (exigence explicite du TP9) ----
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

  # ------------------------------------------------------------------
  # HTTP (8080, publie en 80) : challenge ACME + redirection HTTPS
  # ------------------------------------------------------------------
  server {
    listen 8080;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ------------------------------------------------------------------
  # HTTPS (8443, publie en 443)
  # ------------------------------------------------------------------
  server {
    listen 8443 ssl;
    server_name l1-6.tonyephec.cloud www.l1-6.tonyephec.cloud;

    ssl_certificate     /etc/letsencrypt/live/l1-6.tonyephec.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/l1-6.tonyephec.cloud/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    # ----- /api/misc -----
    location ~ ^/api/misc {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://misc_up;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 300s;
      proxy_send_timeout    300s;
      proxy_read_timeout    300s;
    }

    # ----- /api/products -----
    location ~ ^/api/products {
      limit_req zone=api_limit burst=5 nodelay;
      proxy_pass http://prod_up;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- /api/orders -----
    location ~ ^/api/orders {
      limit_req zone=api_limit burst=2 nodelay;
      proxy_pass http://order_up;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 503 /rate_limit_exceeded.json;
    location = /rate_limit_exceeded.json {
      default_type application/json;
      return 503 '{"error":"Rate limit exceeded","status":503}';
    }

    # ----- reste : contenu statique -----
    location / {
      proxy_pass http://front_up;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
