events {}

http {
  access_log /dev/stdout;
  error_log  /dev/stderr;

  # Upstreams vers tes services (ports internes)
  upstream misc_up    { server misc-service:8080; }
  upstream prod_up    { server product-service:8081; }
  upstream order_up   { server order-service:8082; }
  upstream front_up   { server front:80; }

  # Limite 10 req/s par IP avec bursts configurables par location
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

  server {
    listen 8080;
    server_name _;

    # ----- /api/misc -----
    location ~ ^/api/misc {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://misc_up;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 300s;
      proxy_send_timeout    300s;
      proxy_read_timeout    300s;
    }

    # ----- /api/products -----
    location ~ ^/api/products {
      limit_req zone=api_limit burst=5 nodelay;
      proxy_pass http://prod_up;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- /api/orders -----
    location ~ ^/api/orders {
      limit_req zone=api_limit burst=2 nodelay;
      proxy_pass http://order_up;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Page d’erreur rate limit → JSON
    error_page 503 /rate_limit_exceeded.json;
    location = /rate_limit_exceeded.json {
      default_type application/json;
      return 503 '{"error":"Rate limit exceeded","status":503}';
    }

    # Le reste → front
    location / {
      proxy_pass http://front_up;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

