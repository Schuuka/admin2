version: "3.9"

services:
  reverse:
    image: docker.io/ttranthi/woody-reverse:v1
    ports:
      - "80:8080"
    deploy:
      replicas: 2
      restart_policy: { condition: on-failure }
    networks: [web]

  front:
    image: docker.io/ttranthi/woody-front:v1
    deploy:
      replicas: 2
      restart_policy: { condition: on-failure }
    networks: [web]

  misc-service:
    image: docker.io/ttranthi/woody-misc:v1
    deploy:
      replicas: 2
      restart_policy: { condition: on-failure }
    networks: [web]

  product-service:
    image: docker.io/ttranthi/woody-product:v1
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: mypass
      DB_NAME: woodytoys
    deploy:
      replicas: 2
      restart_policy: { condition: on-failure }
    networks: [web, db]

  order-service:
    image: docker.io/ttranthi/woody-order:v1
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_USER: woody
      RABBIT_PASS: woodypass
      QUEUE_NAME: order_processing
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    networks: [web]

  order-worker:
    image: docker.io/ttranthi/woody-order-worker:v1
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_USER: woody
      RABBIT_PASS: woodypass
      QUEUE_NAME: order_processing
    deploy:
      replicas: 1   # scale ici en cas de pics (ex: 5)
      restart_policy:
        condition: on-failure
    networks: [web]


  db:
    image: mariadb:11.1
    environment:
      MARIADB_ROOT_PASSWORD: mypass
      MARIADB_DATABASE: woodytoys
    volumes:
      - db-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    deploy:
      placement:
        constraints:
          - node.role == manager
    networks: [db]

  rabbitmq:
    image: rabbitmq:3-management
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "15672:15672"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
    start_period: 30s

networks:
  web:
    driver: overlay
  db:
    driver: overlay

volumes:
  db-data:
  rabbitmq-data:
